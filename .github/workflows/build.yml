name: Build AX6000 LEDE

on:
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: 'Resolve latest LEDE/feeds, OpenClash, Mihomo Alpha, stable Zashboard and Tailcat'
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - 'sources.lock.json'

permissions:
  contents: read

concurrency:
  group: ax6000-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
      BUILD_JOBS: '4'
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test source resolution and archive validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Prepare disposable runner
        shell: bash
        run: |
          set -euo pipefail
          # Only preinstalled SDKs on this disposable GitHub-hosted VM.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl ca-certificates \
            swig libelf-dev libgmp-dev libmpc-dev libmpfr-dev libltdl-dev \
            libtool autoconf automake autopoint pkgconf cmake ninja-build \
            cpio patch xz-utils bzip2 help2man texinfo time device-tree-compiler \
            subversion libreadline-dev libglib2.0-dev libfuse-dev libnsl-dev \
            libpython3-dev libzstd-dev zstd jq
          sudo apt-get clean
          df -h .
          free_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$free_kib" -gt 31457280 || { echo 'Need at least 30 GiB free'; exit 1; }
          mkdir -p logs artifacts
          python3 --version
          gcc --version | head -n 1

      - name: Resolve latest upstream revisions
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_sources.py 2>&1 | tee logs/source-update.log

      - name: Show locked component versions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          lock = json.load(open('sources.lock.json'))
          print('### Versions selected for this build\n')
          print('| Component | Version / revision |\n| --- | --- |')
          for key in ('openclash', 'openclash_core', 'zashboard', 'tailcat'):
              print(f"| {key} | {lock[key]['version']} |")
          for key, source in [('lede', lock['lede']), *lock['feeds'].items()]:
              print(f"| {key} | {source['commit']} |")
          print('\nMihomo follows the existing Alpha channel; Zashboard and Tailcat follow stable releases.')
          PY

      - name: Fetch locked sources and resolve configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare.py 2>&1 | tee logs/prepare.log

      - name: Download, compile and validate firmware
        shell: bash
        run: bash scripts/build.sh

      - name: Publish firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax6000-lede-${{ github.run_number }}
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax6000-build-logs-${{ github.run_number }}
          path: |
            logs/
            work/lede/.config
            sources.lock.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Write run summary
        if: success()
        shell: bash
        run: |
          {
            echo '### AX6000 firmware compiled — no flashing performed'
            echo 'Target: mediatek/filogic, xiaomi_redmi-router-ax6000 (NMBM UBI at 0x600000).'
            echo 'Image, checksums, software-versions.json, manifest, resolved config and source lock are in the firmware artifact.'
            echo 'Build validation does not prove boot, Wi-Fi, WAN or configuration migration compatibility.'
            echo '```json'
            cat artifacts/firmware/validation.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
